<svg xmlns="http://www.w3.org/2000/svg" width="220" height="190" viewBox="0 0 220 190" role="img" aria-labelledby="title desc">
  <title id="title">Colorful kawaii fox robot avatar</title>
  <desc id="desc">A minimal friendly fox robot with rounded shapes, colorful ears, big eyes, and subtle animation.</desc>
  <style>
    .foxbot {
      animation: hover 6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .eyes {
      animation: blink 7.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .ear {
      animation: twitch 10s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 70% 90%;
    }
    .status {
      animation: breathe 3.6s ease-in-out infinite;
    }
    @keyframes hover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.5px); }
    }
    @keyframes blink {
      0%, 47%, 50%, 100% { transform: scaleY(1); }
      48.5% { transform: scaleY(.08); }
    }
    @keyframes twitch {
      0%, 79%, 86%, 100% { transform: rotate(0); }
      82% { transform: rotate(-2deg); }
    }
    @keyframes breathe {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g class="foxbot">
    <g class="ear">
      <path d="M49 67 59 18l39 35Z" fill="#FE86AA" stroke="#11131A" stroke-width="6" stroke-linejoin="round"/>
      <path d="m62 48 4-19 20 22Z" fill="#FFEE67"/>
    </g>
    <path d="m122 53 39-35 10 49Z" fill="#6AE1C6" stroke="#11131A" stroke-width="6" stroke-linejoin="round"/>
    <path d="m134 51 20-22 4 19Z" fill="#FFEE67"/>

    <path d="M43 75c0-23 18-38 44-38h46c26 0 44 15 44 38v43c0 31-28 51-67 51s-67-20-67-51Z" fill="#FFF" stroke="#11131A" stroke-width="6"/>
    <path d="M48 73c8-20 24-30 47-34h30c23 4 39 14 47 34-19-8-39-12-62-12S67 65 48 73Z" fill="#FFE200"/>

    <circle class="status" cx="110" cy="52" r="4" fill="#00A0D5"/>
    <circle cx="99" cy="52" r="3" fill="#FF5561"/>
    <circle cx="121" cy="52" r="3" fill="#6AE1C6"/>

    <g class="eyes">
      <rect x="61" y="79" width="39" height="35" rx="15" fill="#11131A"/>
      <rect x="120" y="79" width="39" height="35" rx="15" fill="#11131A"/>
      <circle cx="88" cy="89" r="6" fill="#6AE1C6"/>
      <circle cx="147" cy="89" r="6" fill="#FE86AA"/>
      <circle cx="90" cy="87" r="2" fill="#FFF"/>
      <circle cx="149" cy="87" r="2" fill="#FFF"/>
    </g>

    <circle cx="60" cy="119" r="7" fill="#00A0D5" opacity=".72"/>
    <circle cx="160" cy="119" r="7" fill="#FF5561" opacity=".72"/>

    <rect x="88" y="119" width="44" height="34" rx="15" fill="#F7FAFA" stroke="#11131A" stroke-width="4"/>
    <path d="m103 131 7-5 7 5-7 7Z" fill="#11131A"/>
    <path d="M110 138v4m0 0-6 5m6-5 6 5" fill="none" stroke="#11131A" stroke-width="3" stroke-linecap="round"/>

    <circle cx="43" cy="105" r="4" fill="#6AE1C6" stroke="#11131A" stroke-width="3"/>
    <circle cx="177" cy="105" r="4" fill="#FE86AA" stroke="#11131A" stroke-width="3"/>
    <path d="M94 169v8h32v-8M87 179h46" fill="none" stroke="#11131A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
